<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队 AI 活动监视器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d0f14;
    --panel: #161922;
    --panel-edge: #232733;
    --ink: #e8eaf0;
    --dim: #6b7180;
    --busy: #4ade80;
    --busy-glow: rgba(74, 222, 128, 0.35);
    --idle: #3a3f4d;
    --accent: #f2c94c;
    --cat: #f5f3ee;
    --cat-shadow: #d9d4c8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(circle at 20% 0%, #1a1d27 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .window {
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: linear-gradient(180deg, #1b1f2a, #161922);
    border-bottom: 1px solid var(--panel-edge);
    cursor: default;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .titlebar h1 {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--dim);
    text-transform: uppercase;
    margin-left: 6px;
    font-weight: 600;
  }
  .live {
    margin-left: auto;
    font-size: 10px;
    color: var(--busy);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .live::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--busy);
    box-shadow: 0 0 8px var(--busy-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .roster { padding: 6px; }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: 10px;
    transition: background 0.25s;
  }
  .card:hover { background: rgba(255,255,255,0.02); }
  .card + .card { border-top: 1px solid rgba(255,255,255,0.03); }

  /* ----- the cat ----- */
  .cat-stage {
    width: 56px; height: 46px;
    position: relative;
    flex-shrink: 0;
  }
  .cat-body {
    position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 26px;
    background: var(--cat);
    border-radius: 16px 16px 10px 10px;
  }
  .ear {
    position: absolute;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 11px solid var(--cat);
    top: -7px;
  }
  .ear.l { left: 5px; transform: rotate(-18deg); }
  .ear.r { right: 5px; transform: rotate(18deg); }
  .face {
    position: absolute;
    top: 7px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 10px;
  }
  .eye { position: absolute; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #2a2a2a; }
  .eye.l { left: 2px; } .eye.r { right: 2px; }
  .nose { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 3px; height: 2px; background: #e89; border-radius: 2px; }

  .desk {
    position: absolute;
    bottom: 4px; left: 4px; right: 4px;
    height: 3px; border-radius: 2px;
    background: var(--panel-edge);
  }
  .paw {
    position: absolute;
    bottom: 6px;
    width: 9px; height: 7px;
    background: var(--cat);
    border-radius: 5px 5px 4px 4px;
    transform-origin: top center;
  }
  .paw.l { left: 13px; }
  .paw.r { right: 13px; }

  /* busy = bongo! paws slap alternately */
  .card.busy .paw.l { animation: slapA 0.34s ease-in-out infinite; }
  .card.busy .paw.r { animation: slapB 0.34s ease-in-out infinite; }
  @keyframes slapA { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-7px) rotate(-4deg);} }
  @keyframes slapB { 0%,100% { transform: translateY(-7px) rotate(4deg);} 50% { transform: translateY(0) rotate(4deg);} }
  .card.busy .cat-body { animation: bop 0.34s ease-in-out infinite; }
  @keyframes bop { 0%,100%{ transform: translateX(-50%) translateY(0);} 50%{ transform: translateX(-50%) translateY(-1px);} }

  /* idle = dozing, slight breathe */
  .card.idle .cat-body { animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{ transform: translateX(-50%) scaleY(1);} 50%{ transform: translateX(-50%) scaleY(0.97);} }
  .card.idle .cat-stage { opacity: 0.62; }
  .zzz {
    position: absolute; top: -2px; right: 0;
    font-size: 9px; color: var(--dim);
    opacity: 0;
  }
  .card.idle .zzz { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%{ opacity:0; transform: translateY(2px);} 40%{ opacity:0.7;} 100%{ opacity:0; transform: translateY(-8px);} }

  .notes {
    position: absolute; top: -3px; left: -2px;
    font-size: 10px; color: var(--busy);
    opacity: 0;
  }
  .card.busy .notes { animation: note 0.68s ease-in-out infinite; }
  @keyframes note { 0%{ opacity:0; transform: translateY(0) rotate(0);} 30%{opacity:1;} 100%{ opacity:0; transform: translateY(-12px) rotate(-15deg);} }

  /* ----- info ----- */
  .info { flex: 1; min-width: 0; }
  .name-row { display: flex; align-items: center; gap: 7px; }
  .name { font-size: 13px; font-weight: 700; }
  .badge {
    font-size: 9px; padding: 1px 6px; border-radius: 20px;
    letter-spacing: 0.5px; font-weight: 700;
  }
  .card.busy .badge { background: var(--busy-glow); color: var(--busy); }
  .card.idle .badge { background: rgba(255,255,255,0.04); color: var(--dim); }
  .task {
    font-size: 11px; color: var(--dim);
    margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.busy .task { color: #aeb3c2; }
  .meta {
    text-align: right; flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }
  .tok { font-size: 12px; font-weight: 700; color: var(--accent); }
  .tok-lbl { font-size: 9px; color: var(--dim); letter-spacing: 0.5px; }

  .footer {
    padding: 9px 14px; font-size: 10px; color: var(--dim);
    border-top: 1px solid var(--panel-edge);
    display: flex; justify-content: space-between;
    background: #13161e;
  }
  .demo-btn {
    background: none; border: 1px solid var(--panel-edge);
    color: var(--dim); font-family: inherit; font-size: 10px;
    padding: 3px 9px; border-radius: 6px; cursor: pointer;
    transition: all 0.2s;
  }
  .demo-btn:hover { color: var(--ink); border-color: var(--dim); }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <h1>AI 活动监视</h1>
      <span class="live">LIVE</span>
    </div>
    <div class="roster" id="roster"></div>
    <div class="footer">
      <span id="summary">— 在跑</span>
      <button class="demo-btn" onclick="shuffle()">模拟状态变化</button>
    </div>
  </div>

<script>
  const team = [
    { name: '我', busy: true,  task: 'claude code · 重构支付模块', tok: '5.85' },
    { name: '班定悦', busy: true, task: 'codex · 跑测试用例', tok: '72.7' },
    { name: '林松', busy: false, task: '闲置 18 分钟', tok: '1.20' },
  ];

  function cat() {
    return `<div class="cat-stage">
      <span class="notes">♪</span><span class="zzz">z</span>
      <div class="ear l"></div><div class="ear r"></div>
      <div class="cat-body"><div class="face"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span></div></div>
      <div class="desk"></div>
      <div class="paw l"></div><div class="paw r"></div>
    </div>`;
  }

  function render() {
    const r = document.getElementById('roster');
    r.innerHTML = team.map(m => `
      <div class="card ${m.busy ? 'busy' : 'idle'}">
        ${cat()}
        <div class="info">
          <div class="name-row">
            <span class="name">${m.name}</span>
            <span class="badge">${m.busy ? '干活中' : '摸鱼'}</span>
          </div>
          <div class="task">${m.task}</div>
        </div>
        <div class="meta"><div class="tok">${m.tok}万</div><div class="tok-lbl">TOK</div></div>
      </div>`).join('');
    const n = team.filter(m => m.busy).length;
    document.getElementById('summary').textContent = `${n} 人 / ${team.length} 人 在跑`;
  }

  function shuffle() {
    const tasks = ['claude code · 写单元测试', 'codex · 调试接口', 'claude code · 生成文档', 'codex · 重构组件'];
    team.forEach(m => {
      m.busy = Math.random() > 0.4;
      if (m.busy) { m.task = tasks[Math.floor(Math.random()*tasks.length)]; m.tok = (Math.random()*80+1).toFixed(2); }
      else m.task = `闲置 ${Math.floor(Math.random()*30+1)} 分钟`;
    });
    render();
  }

  render();
</script>
</body>
</html>
