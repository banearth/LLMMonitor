<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLMMonitor</title>
  </head>
  <body>
    <div id="root">
      <div class="card" data-tauri-drag-region>
        <button id="close" class="close" title="Close">x</button>
        <span class="sync" id="sync" title="Refresh now">
          <span class="sync-ico" id="sync-ico">R</span><span id="sync-time">--:--</span>
        </span>

        <section class="zone" id="zone-claude" data-tauri-drag-region>
          <div class="head" data-tauri-drag-region>
            <span class="brand claude">Claude</span>
          </div>
          <div class="primary" data-tauri-drag-region>
            <div class="big">
              <span class="pct" id="claude-pct">--</span><span class="punit">%</span>
              <span class="plabel">left</span>
            </div>
            <div class="bar"><div class="fill" id="claude-bar"></div></div>
          </div>
          <div class="rows">
            <div class="row"><span class="k">5h</span><span class="v" id="claude-5h">reset --:--</span></div>
            <div class="row"><span class="k">7d</span><span class="v" id="claude-7d">-- - --</span></div>
            <div class="row today"><span class="k">today</span><span class="v" id="claude-today">$-- - -- tok</span></div>
          </div>
          <div class="note" id="claude-note"></div>
        </section>

        <div class="divider"></div>

        <section class="zone" id="zone-codex" data-tauri-drag-region>
          <div class="head" data-tauri-drag-region>
            <span class="brand codex">Codex</span>
          </div>
          <div class="primary" data-tauri-drag-region>
            <div class="big">
              <span class="pct" id="codex-pct">--</span><span class="punit">%</span>
              <span class="plabel">left</span>
            </div>
            <div class="bar"><div class="fill" id="codex-bar"></div></div>
          </div>
          <div class="rows">
            <div class="row"><span class="k">5h</span><span class="v" id="codex-5h">reset --:--</span></div>
            <div class="row"><span class="k">7d</span><span class="v" id="codex-7d">-- - --</span></div>
            <div class="row today"><span class="k">today</span><span class="v" id="codex-today">$-- - -- tok</span></div>
          </div>
          <div class="note" id="codex-note"></div>
        </section>
      </div>

      <div class="stack empty" id="stack"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
